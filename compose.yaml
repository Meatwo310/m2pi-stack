services:
  bot:
    image: m2pi-stack:${M2PI_IMAGE_TAG:-local}
    build: .
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    init: true
    depends_on:
      agent:
        condition: service_healthy
    environment:
      DISCORD_ADMIN_USER_IDS: ${DISCORD_ADMIN_USER_IDS:?Set DISCORD_ADMIN_USER_IDS}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-false}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      M2PI_AGENT_URL: http://agent:8787
      M2PI_DEFAULT_MODEL: ${M2PI_DEFAULT_MODEL:-openrouter:openrouter/free}
    secrets:
      - discord_token
    volumes:
      - bot_state:/data

  agent:
    image: m2pi-stack:${M2PI_IMAGE_TAG:-local}
    build: .
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - agent_state:/data
      - workspace:/workspace

secrets:
  discord_token:
    file: ${INSTANCE_DIR:?Set INSTANCE_DIR}/secrets/discord_token

volumes:
  bot_state:
  agent_state:
  workspace:
